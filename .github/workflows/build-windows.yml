name: בניית תוכנת Windows ההיברידית

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: התקנת Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: התקנת ספריות
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF==1.26.7 python-docx striprtf pillow tkinterdnd2 openpyxl python-pptx pyinstaller
      - name: בדיקות קוד ויחידה
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m py_compile "src/ספריית_המתכונים.py" src/cloud_client.py src/recipe_center.py src/recipe_scanner.py
          python -m unittest discover -s tests -v
      - name: יצירת אייקון
        run: python assets/create_icon.py
      - name: יצירת EXE
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --icon "assets/app_icon.ico"
          --add-data "assets/app_icon.ico;assets"
          --name "ספריית_המתכונים_שלי_Online"
          --collect-all fitz
          --collect-all PIL
          --collect-all tkinterdnd2
          --hidden-import striprtf.striprtf
          --hidden-import docx
          --hidden-import cloud_client
          "src/ספריית_המתכונים.py"
      - name: בדיקת EXE והפעלה
        shell: pwsh
        run: |
          $exe = "dist/ספריית_המתכונים_שלי_Online.exe"
          if (!(Test-Path $exe)) { throw "קובץ ההפעלה לא נוצר" }
          if ((Get-Item $exe).Length -lt 5000000) { throw "קובץ ההפעלה קטן מהצפוי" }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "התוכנה נסגרה מיד לאחר ההפעלה" }
          taskkill /PID $process.Id /T /F | Out-Null
      - name: יצירת חבילת התקנה
        shell: pwsh
        run: |
          $root = "dist/חבילת-ספריית-המתכונים-Online"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "dist/ספריית_המתכונים_שלי_Online.exe" "$root/"
          @'
          ספריית המתכונים שלי — Hybrid Online
          1. חלצו את קובץ ה-ZIP לתיקייה.
          2. הפעילו את ספריית_המתכונים_שלי_Online.exe.
          3. בהגדרות התוכנה בדקו את כתובת שירות העיבוד המקוון.
          המתכונים, מסד הנתונים וקובצי המקור נשמרים במחשב.
          סריקת OCR והמרת מסמכי Office שולחות לשרת רק את הקובץ שנבחר לפעולה.
          פעולות אלה דורשות חיבור לאינטרנט.
          '@ | Set-Content -Encoding UTF8 "$root/קראו-לפני-הפעלה.txt"
          Compress-Archive -Path "$root/*" -DestinationPath "dist/ספריית-המתכונים-שלי-Online-Windows.zip" -CompressionLevel Optimal
          if (!(Test-Path "dist/ספריית-המתכונים-שלי-Online-Windows.zip")) { throw "חבילת ZIP לא נוצרה" }
          Write-Host "Package bytes: $((Get-Item 'dist/ספריית-המתכונים-שלי-Online-Windows.zip').Length)"
      - name: העלאת חבילת Windows
        uses: actions/upload-artifact@v4
        with:
          name: HamitkonimSheli-Online-Windows
          path: dist/ספריית-המתכונים-שלי-Online-Windows.zip
          if-no-files-found: error
          retention-days: 30

  capture-screenshot:
    name: הרצה שנייה – צילום מסך לאחר בדיקות תקינות
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: הורדת קובצי הפרויקט
        uses: actions/checkout@v4
      - name: התקנת סביבת פייתון לצילום
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: התקנת ספריות להצגת נתוני ההדגמה
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF==1.26.7 python-docx striprtf pillow tkinterdnd2 openpyxl python-pptx
      - name: הורדת חבילת Windows מההרצה הראשונה
        uses: actions/download-artifact@v4
        with:
          name: HamitkonimSheli-Online-Windows
          path: artifacts
      - name: חילוץ חבילת התוכנה
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath "artifacts" -Filter "*.zip" -File | Select-Object -First 1
          if (!$archive) { throw "The verified Windows package was not found." }
          $packageRoot = "dist/חבילת-ספריית-המתכונים-Online"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $packageRoot -Force
          $exe = Join-Path $packageRoot "ספריית_המתכונים_שלי_Online.exe"
          if (!(Test-Path $exe)) { throw "The application executable is missing from the verified package." }
      - name: הרצת התוכנה מחדש וצילום מסך אמיתי
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "recipe-ui-demo-profile"
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          $env:PYTHONPATH = "src"
          python scripts/create_ui_demo_data.py
          if ($LASTEXITCODE -ne 0) { throw "Demo library creation failed." }
          $exe = "dist/חבילת-ספריית-המתכונים-Online/ספריית_המתכונים_שלי_Online.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 12
            python scripts/capture_app_screenshot.py --output "dist/recipe-library-real-ui.png" --process-id $process.Id --expected-items 6
            if ($LASTEXITCODE -ne 0) { throw "Real application screenshot validation failed." }
            $shot = Get-Item "dist/recipe-library-real-ui.png" -ErrorAction Stop
            if ($shot.Length -lt 100000) { throw "Real application screenshot is unexpectedly small." }
            Write-Host "Verified real app screenshot: $($shot.Length) bytes."
          } finally {
            if ($process -and !$process.HasExited) { taskkill /PID $process.Id /T /F | Out-Null }
          }
      - name: צילום מסך אמיתי של הממשק מתוך Windows – שמירת התוצר
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: צילום-מסך-אמיתי-של-התוכנה
          path: dist/recipe-library-real-ui.png
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: פרסום גרסה להורדה
    needs: [build-windows, capture-screenshot]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: הורדת חבילת Windows שנבדקה
        uses: actions/download-artifact@v4
        with:
          name: HamitkonimSheli-Online-Windows
          path: release-files
      - name: בדיקת קובץ החבילה
        run: |
          test -s release-files/ספריית-המתכונים-שלי-Online-Windows.zip
          ls -lh release-files/ספריית-המתכונים-שלי-Online-Windows.zip
      - name: פרסום GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ספריית המתכונים שלי – Hybrid Online 1.0.0
          target_commitish: main
          draft: false
          prerelease: false
          overwrite_files: true
          generate_release_notes: false
          body: |
            גרסת Windows היברידית: ספריית המתכונים נשמרת מקומית במחשב, ופעולות OCR והמרת Office מתבצעות דרך שירות עיבוד מקוון.

            **הורדה:** חלצו את קובץ ה-ZIP והפעילו את קובץ ה-EXE.

            **חשוב:** יש לפרוס את שירות העיבוד לפי README.md, לוודא שהכתובת נגישה ולבדוק אותה מתוך נטפרי לפני שימוש בסריקה ובהמרת Office.
          files: release-files/ספריית-המתכונים-שלי-Online-Windows.zip
